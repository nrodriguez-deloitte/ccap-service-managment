app:
  id: ari:cloud:ecosystem::app/ad374e41-31d5-4d57-9921-3c92890af29e
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64

modules:
  jiraServiceManagement:queuePage:
    - key: ccap-service-management
      resource: main
      resolver:
        function: resolver
      layout: blank
      title: CCAP Service Management

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/ccap/build

permissions:
  content:
    scripts:
      - unsafe-eval
    styles:
      - unsafe-inline
  external:
    scripts:
      - address: https://maps.googleapis.com
    styles:
      - address: https://fonts.googleapis.com
    images:
      - address: https://maps.gstatic.com
      - address: https://maps.googleapis.com
      - address: https://*.googleusercontent.com
      - address: https://*.google.com
    fetch:
      client:
        - address: https://mock.httpstatus.io
        - address: https://maps.googleapis.com
      backend:
        - address: https://mock.httpstatus.io
        - address: https://maps.googleapis.com
  scopes: []
